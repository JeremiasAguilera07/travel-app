<!DOCTYPE html>
<html>
<head>
  <title>Travel App PRO</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      background: linear-gradient(135deg, #eef2f3, #dfe9f3);
      font-family: 'Segoe UI', sans-serif;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .card {
      border-radius: 20px;
      transition: 0.3s;
      background: rgba(255,255,255,0.8);
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
    }

    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 0.6s forwards;
    }

    @keyframes fadeIn {
      to { opacity:1; transform: translateY(0); }
    }

    .favorite {
      cursor: pointer;
      font-size: 20px;
    }

    .favorite.active {
      color: red;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: black;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      opacity: 0;
      transition: 0.3s;
    }

    #toast.show {
      opacity: 1;
    }

    #map {
      height: 400px;
      border-radius: 20px;
    }
  </style>
</head>

<body class="p-4">

<h1>✈️ Travel App Argentina</h1>

<input id="priceFilter" class="form-control mb-4" placeholder="Filtrar por precio máximo">

<div id="loading" class="text-center my-5 d-none">
  <div class="spinner-border text-primary"></div>
</div>

<h2>Ciudades</h2>
<div id="cities" class="row"></div>

<h2 class="mt-5">Mapa</h2>
<div id="map"></div>

<h2 class="mt-5">Vuelos</h2>
<div id="flights" class="row"></div>

<h2 class="mt-5">Historial</h2>
<ul id="history"></ul>

<div id="toast"></div>

<div class="modal fade" id="flightModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="modalTitle"></h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
